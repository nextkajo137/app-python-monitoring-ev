<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - EV Charger Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }
    .auth-card {
        width: 100%;
        max-width: 480px;
        padding: 40px;
        text-align: center;
        border-radius: 20px;
    }
    .auth-icon {
        font-size: 3rem;
        margin-bottom: 10px;
    }
    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: rgba(255,255,255,0.8);
        font-size: 0.9rem;
    }
    .form-group input, .form-group select {
        width: 100%;
        padding: 12px;
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.2);
        color: #fff;
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
        box-sizing: border-box;
    }
    .form-group select option {
        background: #0a1424;
        color: #fff;
    }
    .form-group input:focus, .form-group select:focus {
        outline: none;
        border-color: #00eaff;
        background: rgba(0,0,0,0.5);
    }
    .auth-footer {
        margin-top: 25px;
        font-size: 0.9rem;
        color: rgba(255,255,255,0.6);
    }
    .auth-footer a {
        color: #00eaff;
        text-decoration: none;
        font-weight: 600;
    }
    .alert-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        width: 90%;
        max-width: 400px;
    }
    .alert {
        padding: 12px 20px;
        border-radius: 8px;
        margin-bottom: 10px;
        text-align: center;
        font-weight: 500;
        font-size: 0.9rem;
    }
    .alert-error {
        background: rgba(255, 71, 87, 0.2);
        border: 1px solid #ff4757;
        color: #ff4757;
        backdrop-filter: blur(10px);
    }
    .alert-success {
        background: rgba(46, 213, 115, 0.2);
        border: 1px solid #2ed573;
        color: #2ed573;
        backdrop-filter: blur(10px);
    }
    .flex-row {
        display: flex;
        gap: 15px;
    }
    .flex-row .form-group {
        flex: 1;
    }
  </style>
</head>
<body>
  <div class="aurora aurora-a"></div>
  <div class="aurora aurora-b"></div>

  <div class="alert-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
  </div>

  <div class="glass auth-card">
    <div class="auth-icon">⚡</div>
    <h2 style="margin-bottom: 5px;">Buat Akun</h2>
    <p style="color: rgba(255,255,255,0.6); margin-bottom: 30px;">Daftarkan akun baru untuk melanjutkan</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Pilih username" required>
        </div>
        
        <div class="flex-row">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Buat password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Konfirmasi Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Ulangi password" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="role">Role Akses</label>
            <select id="role" name="role">
                <option value="user">User (Monitoring)</option>
                <option value="admin">Admin (Pengelola)</option>
            </select>
        </div>
        
        <button type="submit" class="btn primary" style="width: 100%; padding: 14px; font-size: 1.05rem; margin-top: 10px;">Daftar Sekarang</button>
    </form>

    <div class="auth-footer">
        Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk Disini</a>
    </div>
  </div>
</body>
</html>
